<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="cosmicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#8A2BE2" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <radialGradient id="singularityGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#8A2BE2" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#090A0F" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="220" fill="url(#singularityGlow)" />

  <!-- Outer Orbit Ring -->
  <circle cx="256" cy="256" r="200" stroke="url(#cosmicGrad)" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />

  <!-- 8-Point Cosmic Star Backplate -->
  <path d="M256 16 L278 200 L448 200 L310 286 L376 456 L256 348 L136 456 L202 286 L64 200 L234 200 Z"
        fill="url(#cosmicGrad)" opacity="0.15" />

  <!-- Interlocking Infinity Core -->
  <path d="M176 256 C136 216 96 226 96 256 C96 286 136 296 176 256 L336 256 C376 216 416 226 416 256 C416 286 376 296 336 256 Z"
        stroke="url(#cosmicGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" fill="none" />

  <!-- Central Cosmic Singularity Diamond -->
  <polygon points="256,196 304,256 256,316 208,256" fill="#090A0F" stroke="#00F0FF" stroke-width="4" filter="url(#glow)" />
  <circle cx="256" cy="256" r="10" fill="#00F0FF" />

  <!-- Orbital Node Satellites (Representing 6 Stones) -->
  <circle cx="256" cy="76" r="7" fill="#00F0FF" />
  <circle cx="383" cy="129" r="7" fill="#8A2BE2" />
  <circle cx="436" cy="256" r="7" fill="#FF0044" />
  <circle cx="383" cy="383" r="7" fill="#FF8800" />
  <circle cx="256" cy="436" r="7" fill="#00FF66" />
  <circle cx="129" cy="383" r="7" fill="#FFE600" />
</svg>